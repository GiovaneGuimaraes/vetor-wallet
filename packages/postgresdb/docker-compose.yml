# Postgres local para desenvolvimento e para a suíte de integração.
#
# É a peça que devolve o desenvolvimento offline na migração (§2 do
# plano-migracao-aws.md): o mesmo dialeto da Aurora, na máquina, sem nuvem.
# A porta é 5433 de propósito — 5432 costuma já estar ocupada por um Postgres
# de outro projeto, e descobrir isso por um erro de autenticação confuso custa
# mais que um número diferente.
services:
  postgres:
    image: postgres:16-alpine
    container_name: vetor-wallet-postgres
    environment:
      POSTGRES_USER: vetor
      POSTGRES_PASSWORD: vetor
      POSTGRES_DB: vetor_wallet
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vetor -d vetor_wallet']
      interval: 2s
      timeout: 3s
      retries: 20
