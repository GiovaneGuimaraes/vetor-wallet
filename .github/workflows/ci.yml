name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ci:
    name: Install · Build · Lint · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth 0 (historico completo): o discord-guard le `git log` do
          # BACKLOG.md/TODO-HUMANO.md para achar o ultimo commit que tocou cada
          # um. Com o default (shallow, so o commit do push/PR), esse commit
          # pode nao existir no clone se o arquivo nao mudou na PONTA — o guard
          # ficaria sem historico e degradaria (avisa, nao reprova; ver
          # tools/discord-guard.mjs), o que silenciosamente desligaria a
          # checagem em toda PR que nao tocasse esses dois arquivos por ultimo.
          fetch-depth: 0

      # Node 24 (decisao do humano, 2026-09-13). Estava no 20, que saiu do EOL,
      # e a divergencia cobrou: o jsdom@30 dos testes de render da T-092 puxa um
      # undici que exige Node novo — passou local (24) e quebrou so aqui, com um
      # resumo dizendo "470 passed" enquanto os dois arquivos de teste de
      # componente nem carregavam. Verde enganoso e pior que vermelho honesto.
      # Nao e 22 porque o 22 ja esta em manutencao: seria sair do EOL para a
      # proxima fila do EOL. A regra por tras: o CI so vale enquanto roda o
      # mesmo runtime de quem desenvolve.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.32.1'

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Higiene do backlog: teto de tamanho e nenhuma tarefa CONCLUIDA parada nele.
      # A regra existia em prosa no README desde o ciclo 1 e foi ignorada por 20
      # ciclos, ate o arquivo chegar a 78 KB — por isso ela roda aqui, e nao "quando
      # alguem lembrar".
      - name: Backlog hygiene
        run: pnpm backlog:check

      # Espelho do Discord: reprova se o ultimo commit em BACKLOG.md/TODO-HUMANO.md
      # ficou mais novo que o espelho registrado em discord-state.json. Mesma
      # historia do guard acima — a regra existia em prosa no README e falhou no
      # mesmo dia em que foi escrita (2026-08-12, T-090).
      - name: Discord mirror hygiene
        run: pnpm discord:check

      - name: Test
        run: pnpm test
