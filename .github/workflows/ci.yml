name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ci:
    name: Install · Build · Lint · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.32.1'

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Higiene do backlog: teto de tamanho e nenhuma tarefa CONCLUIDA parada nele.
      # A regra existia em prosa no README desde o ciclo 1 e foi ignorada por 20
      # ciclos, ate o arquivo chegar a 78 KB — por isso ela roda aqui, e nao "quando
      # alguem lembrar".
      - name: Backlog hygiene
        run: pnpm backlog:check

      - name: Test
        run: pnpm test
